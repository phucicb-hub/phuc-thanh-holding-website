name: phucthanh-ai-shop
services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure database password}
    volumes:
      - shop_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 15
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    build: .
    restart: unless-stopped
    env_file: .env.runtime
    extra_hosts:
      - "mail.phucthanhholding.com:192.168.1.238"
    environment:
      DATABASE_URL: postgresql://shop_runtime:${SHOP_RUNTIME_PASSWORD:?Configure runtime password}@database:5432/shop
      RUN_MIGRATIONS: "false"
      PORT: 8090
      TRUST_PROXY: "true"
    depends_on:
      database:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    init: true
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  website:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:3015:80"]
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  shop_database:
