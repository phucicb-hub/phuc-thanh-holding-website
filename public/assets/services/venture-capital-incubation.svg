<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" fill="none" style="display:block;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="vcBgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="45%" stop-color="#046842" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="vcGrowthAura" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vcEmeraldAura" cx="30%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#046842" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Gradients -->
    <linearGradient id="vcGlassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.84"/>
    </linearGradient>
    <linearGradient id="vcCardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="vcBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="vcGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="vcEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#046842"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#046842" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#046842" stop-opacity="0"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="vcShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.03"/>
    </filter>
    <filter id="vcCardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>

    <pattern id="vcDotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="400" rx="24" fill="#fafcff"/>
  <rect width="640" height="400" rx="24" fill="url(#vcBgGlow)"/>
  <rect x="20" y="20" width="600" height="360" rx="18" fill="url(#vcDotGrid)"/>

  <!-- Radial Glows -->
  <circle cx="420" cy="150" r="160" fill="url(#vcGrowthAura)"/>
  <circle cx="180" cy="250" r="140" fill="url(#vcEmeraldAura)"/>

  <!-- Orbital Investment Synergy Rings (Apple Style Ecosystem Circles) -->
  <g opacity="0.35">
    <ellipse cx="440" cy="220" rx="150" ry="80" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 4"/>
    <ellipse cx="440" cy="220" rx="90" ry="48" stroke="#046842" stroke-width="1" stroke-dasharray="2 3"/>
  </g>

  <!-- ================= MAIN VENTURE VALUATION & ACCELERATION CARD ================= -->
  <g filter="url(#vcShadow)">
    <rect x="56" y="52" width="370" height="295" rx="18" fill="url(#vcGlassFill)" stroke="url(#vcBorder)" stroke-width="1.2"/>

    <!-- Top Window Bar -->
    <rect x="56" y="52" width="370" height="38" rx="18" fill="#f0f9ff" fill-opacity="0.85"/>
    <rect x="56" y="76" width="370" height="14" fill="#f0f9ff"/>
    <line x1="56" y1="90" x2="426" y2="90" stroke="#e0f2fe" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="76" cy="71" r="5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="92" cy="71" r="5" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="108" cy="71" r="5" fill="#10b981" fill-opacity="0.8"/>

    <!-- Title Badge -->
    <rect x="134" y="62" width="156" height="20" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="146" cy="72" r="3" fill="#0284c7"/>
    <text x="156" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="10" font-weight="600" fill="#334155">strategic-incubation.fund</text>

    <!-- Fund Allocation Pill -->
    <g transform="translate(330, 63)">
      <rect width="82" height="18" rx="5" fill="#0284c7" fill-opacity="0.12"/>
      <circle cx="8" cy="9" r="3" fill="#0284c7"/>
      <text x="16" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8.5" font-weight="700" fill="#0284c7">TIER 1 SEED</text>
    </g>

    <!-- Fund Metrics Overview -->
    <g transform="translate(76, 102)">
      <!-- Metric 1: Capital Growth Rate -->
      <g>
        <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8.5" font-weight="600" fill="#64748b">PORTFOLIO IRR</text>
        <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="18" font-weight="800" fill="#046842">+38.4%</text>
        <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8" font-weight="500" fill="#10b981">● Top Quartile</text>
      </g>

      <line x1="100" y1="2" x2="100" y2="42" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Metric 2: Multiple of Invested Capital -->
      <g transform="translate(116, 0)">
        <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8.5" font-weight="600" fill="#64748b">VALUATION MOIC</text>
        <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="18" font-weight="800" fill="#d97706">3.8x</text>
        <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8" font-weight="500" fill="#d97706">● Strategic Horizon</text>
      </g>
    </g>

    <!-- Exponential J-Curve Growth Chart Display -->
    <g transform="translate(76, 156)">
      <rect width="326" height="114" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Grid lines inside chart -->
      <g stroke="#cbd5e1" stroke-width="0.8" opacity="0.3" stroke-dasharray="2 3">
        <line x1="20" y1="25" x2="306" y2="25"/>
        <line x1="20" y1="55" x2="306" y2="55"/>
        <line x1="20" y1="85" x2="306" y2="85"/>
        <line x1="90" y1="10" x2="90" y2="104"/>
        <line x1="170" y1="10" x2="170" y2="104"/>
        <line x1="250" y1="10" x2="250" y2="104"/>
      </g>

      <!-- Shaded Area Under Curve -->
      <path d="M 24 95 Q 90 92, 140 76 T 220 44 T 300 16 L 300 95 L 24 95 Z" fill="url(#chartAreaGrad)"/>

      <!-- Growth Curve Line -->
      <path d="M 24 95 Q 90 92, 140 76 T 220 44 T 300 16" fill="none" stroke="url(#vcEmeraldGrad)" stroke-width="3" stroke-linecap="round"/>

      <!-- Milestone 1: Seed Formation -->
      <circle cx="80" cy="93" r="4" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
      <text x="68" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="7.5" font-weight="600" fill="#64748b">Incubate</text>

      <!-- Milestone 2: Product-Market Fit -->
      <circle cx="160" cy="68" r="4" fill="#046842" stroke="#ffffff" stroke-width="1.5"/>
      <text x="148" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="7.5" font-weight="700" fill="#046842">PMF / MVP</text>

      <!-- Milestone 3: Scale & ARR -->
      <circle cx="230" cy="40" r="4.5" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
      <text x="214" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="7.5" font-weight="700" fill="#d97706">Series A</text>

      <!-- Peak Star Milestone -->
      <circle cx="300" cy="16" r="6" fill="url(#vcGoldGrad)" stroke="#ffffff" stroke-width="2"/>
      <polygon points="300,12 302,15 305,15 303,17 304,20 300,18 296,20 297,17 295,15 298,15" fill="#ffffff"/>
    </g>

    <!-- Bottom Feature Tags -->
    <g transform="translate(76, 282)">
      <rect width="146" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
      <circle cx="10" cy="12" r="3" fill="#046842"/>
      <text x="20" y="15.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" font-weight="600" fill="#334155">Operational Co-founding</text>

      <rect x="156" y="0" width="160" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
      <circle cx="166" cy="12" r="3" fill="#d97706"/>
      <text x="176" y="15.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" font-weight="600" fill="#334155">Proprietary Tech Scaffolding</text>
    </g>
  </g>

  <!-- ================= FLOATING WIDGET 1: SYNERGY INDEX (TOP RIGHT) ================= -->
  <g transform="translate(390, 42)" filter="url(#vcCardShadow)">
    <rect width="210" height="154" rx="16" fill="url(#vcCardGlass)" stroke="url(#vcBorder)" stroke-width="1.2"/>

    <g transform="translate(14, 14)">
      <rect width="28" height="28" rx="8" fill="#0284c7" fill-opacity="0.12"/>
      <path d="M 8 18 L 14 11 L 18 14 L 23 8 M 20 8 L 23 8 L 23 11" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="11" font-weight="700" fill="#0f172a">Ecosystem Synergy</text>
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8.5" fill="#0284c7">High Network Multiplier</text>
    </g>

    <!-- Mini Synergistic Wheel -->
    <g transform="translate(20, 56)">
      <!-- Central Holding Node -->
      <rect x="58" y="16" width="54" height="28" rx="8" fill="#046842" fill-opacity="0.1" stroke="#046842" stroke-width="1.2"/>
      <text x="85" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" font-weight="800" fill="#046842" text-anchor="middle">HOLDING</text>

      <!-- Node 1: Software -->
      <circle cx="28" cy="14" r="12" fill="#f8fafc" stroke="#046842" stroke-width="1"/>
      <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8" font-weight="700" fill="#046842" text-anchor="middle">SaaS</text>
      <line x1="39" y1="20" x2="58" y2="26" stroke="#046842" stroke-width="1" stroke-dasharray="2 2"/>

      <!-- Node 2: Health -->
      <circle cx="28" cy="46" r="12" fill="#f8fafc" stroke="#10b981" stroke-width="1"/>
      <text x="28" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="7.5" font-weight="700" fill="#10b981" text-anchor="middle">Health</text>
      <line x1="39" y1="40" x2="58" y2="34" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2"/>

      <!-- Node 3: EdTech -->
      <circle cx="142" cy="14" r="12" fill="#f8fafc" stroke="#d97706" stroke-width="1"/>
      <text x="142" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8" font-weight="700" fill="#d97706" text-anchor="middle">LMS</text>
      <line x1="131" y1="20" x2="112" y2="26" stroke="#d97706" stroke-width="1" stroke-dasharray="2 2"/>

      <!-- Node 4: Capital -->
      <circle cx="142" cy="46" r="12" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
      <text x="142" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="7.5" font-weight="700" fill="#0284c7" text-anchor="middle">Fund</text>
      <line x1="131" y1="40" x2="112" y2="34" stroke="#0284c7" stroke-width="1" stroke-dasharray="2 2"/>
    </g>

    <!-- Bottom Metric -->
    <g transform="translate(14, 118)">
      <rect width="182" height="24" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.8"/>
      <circle cx="12" cy="12" r="3" fill="#046842"/>
      <text x="22" y="15.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" font-weight="600" fill="#334155">Cross-pollination: </text>
      <text x="106" y="15.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" font-weight="700" fill="#046842">98.5% Synergistic</text>
    </g>
  </g>

  <!-- ================= FLOATING WIDGET 2: CAPITAL DEPLOYMENT (BOTTOM RIGHT) ================= -->
  <g transform="translate(420, 218)" filter="url(#vcCardShadow)">
    <rect width="190" height="142" rx="16" fill="url(#vcCardGlass)" stroke="url(#vcBorder)" stroke-width="1.2"/>

    <g transform="translate(16, 16)">
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="11" font-weight="700" fill="#0f172a">Capital Deployment</text>
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" fill="#64748b">Long-term Patient Capital</text>

      <!-- Capital Progress -->
      <g transform="translate(0, 36)">
        <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="18" font-weight="800" fill="#046842">$50M+</text>
        <text x="56" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" font-weight="600" fill="#64748b">Target Asset Base</text>

        <!-- Multi-segment bar -->
        <g transform="translate(0, 20)">
          <rect x="0" y="0" width="70" height="8" rx="4" fill="#046842"/>
          <rect x="74" y="0" width="50" height="8" rx="4" fill="#10b981"/>
          <rect x="128" y="0" width="30" height="8" rx="4" fill="#f59e0b"/>
        </g>

        <!-- Segment labels -->
        <g transform="translate(0, 38)">
          <circle cx="3" cy="4" r="2.5" fill="#046842"/>
          <text x="9" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="7.5" fill="#64748b">Direct Tech</text>

          <circle cx="62" cy="4" r="2.5" fill="#10b981"/>
          <text x="68" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="7.5" fill="#64748b">Health</text>

          <circle cx="110" cy="4" r="2.5" fill="#f59e0b"/>
          <text x="116" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="7.5" fill="#64748b">EdTech</text>
        </g>
      </g>
    </g>

    <!-- Bottom tag -->
    <g transform="translate(16, 110)">
      <rect width="158" height="20" rx="5" fill="#046842" fill-opacity="0.08"/>
      <path d="M 8 10 L 11 13 L 16 7" stroke="#046842" stroke-width="1.5" stroke-linecap="round"/>
      <text x="22" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8.5" font-weight="700" fill="#046842">Institutional Governance</text>
    </g>
  </g>
</svg>
