<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" fill="none" style="display:block;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#046842" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="neuralGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#046842" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#046842" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Gradients -->
    <linearGradient id="glassFill1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="glassFillSubtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#046842"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#046842"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="appleShadowLg" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.03"/>
    </filter>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="400" rx="24" fill="#fafbfe"/>
  <rect width="640" height="400" rx="24" fill="url(#bgGlow1)"/>
  <rect x="20" y="20" width="600" height="360" rx="18" fill="url(#dotGrid)"/>

  <!-- Radial Aura Glows -->
  <circle cx="340" cy="180" r="160" fill="url(#neuralGlow)"/>
  <circle cx="520" cy="100" r="110" fill="url(#amberGlow)"/>

  <!-- Geometric Interconnect Bus Lines (Circuit / Pipeline) -->
  <g opacity="0.45" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3">
    <path d="M 60 120 L 220 120 L 270 170 L 410 170 L 460 110 L 590 110"/>
    <path d="M 120 280 L 260 280 L 320 220 L 460 220 L 520 270 L 600 270"/>
    <path d="M 270 170 L 320 220"/>
  </g>

  <!-- Animated-like Energy Pulse Lines -->
  <path d="M 140 120 L 220 120 L 270 170 L 370 170" stroke="url(#emeraldGradient)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 370 170 L 410 170 L 460 110 L 530 110" stroke="url(#amberGradient)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="270" cy="170" r="3.5" fill="#10b981"/>
  <circle cx="460" cy="110" r="3.5" fill="#f59e0b"/>

  <!-- ================= MAIN IDE & CLOUD ARCHITECTURE CONTAINER ================= -->
  <g filter="url(#appleShadowLg)">
    <!-- Base Glass Canvas -->
    <rect x="56" y="52" width="370" height="295" rx="18" fill="url(#glassFill1)" stroke="url(#glassBorder)" stroke-width="1.2"/>
    
    <!-- Top Window Bar (Apple Style Chrome) -->
    <rect x="56" y="52" width="370" height="38" rx="18" fill="#f8fafc" fill-opacity="0.9"/>
    <rect x="56" y="76" width="370" height="14" fill="#f8fafc"/>
    <line x1="56" y1="90" x2="426" y2="90" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Traffic Light Buttons -->
    <circle cx="76" cy="71" r="5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="92" cy="71" r="5" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="108" cy="71" r="5" fill="#10b981" fill-opacity="0.8"/>

    <!-- Tab Pill -->
    <rect x="134" y="62" width="136" height="20" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="146" cy="72" r="3" fill="#046842"/>
    <text x="156" y="76" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto" font-size="10" font-weight="600" fill="#334155">cluster-pipeline.ts</text>

    <!-- Branch / Cloud Indicator -->
    <g transform="translate(346, 64)">
      <rect width="66" height="18" rx="5" fill="#046842" fill-opacity="0.1"/>
      <circle cx="8" cy="9" r="3" fill="#046842"/>
      <text x="16" y="13" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI'" font-size="9" font-weight="700" fill="#046842">ACTIVE</text>
    </g>

    <!-- Code & Architecture Visualization -->
    <!-- Code Line Gutter -->
    <text x="76" y="118" font-family="'SF Mono', Menlo, monospace" font-size="9" fill="#94a3b8">01</text>
    <text x="76" y="138" font-family="'SF Mono', Menlo, monospace" font-size="9" fill="#94a3b8">02</text>
    <text x="76" y="158" font-family="'SF Mono', Menlo, monospace" font-size="9" fill="#94a3b8">03</text>
    <text x="76" y="178" font-family="'SF Mono', Menlo, monospace" font-size="9" fill="#94a3b8">04</text>
    <text x="76" y="198" font-family="'SF Mono', Menlo, monospace" font-size="9" fill="#94a3b8">05</text>
    <text x="76" y="218" font-family="'SF Mono', Menlo, monospace" font-size="9" fill="#94a3b8">06</text>

    <!-- Syntax Code Blocks -->
    <text x="100" y="118" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#046842">const</text>
    <text x="136" y="118" font-family="'SF Mono', Menlo, monospace" font-size="10" fill="#0284c7">neuralAgent</text>
    <text x="210" y="118" font-family="'SF Mono', Menlo, monospace" font-size="10" fill="#64748b">=</text>
    <text x="224" y="118" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#d97706">new</text>
    <text x="250" y="118" font-family="'SF Mono', Menlo, monospace" font-size="10" fill="#0f172a">EnterpriseLLM({</text>

    <text x="114" y="138" font-family="'SF Mono', Menlo, monospace" font-size="10" fill="#64748b">nodes:</text>
    <text x="160" y="138" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#059669">['K8s-Edge-01', 'GPU-H100']</text>
    <text x="325" y="138" font-family="'SF Mono', Menlo, monospace" font-size="10" fill="#64748b">,</text>

    <text x="114" y="158" font-family="'SF Mono', Menlo, monospace" font-size="10" fill="#64748b">meshSecurity:</text>
    <text x="200" y="158" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#d97706">'ZeroTrust-mTLS'</text>
    <text x="320" y="158" font-family="'SF Mono', Menlo, monospace" font-size="10" fill="#64748b">,</text>

    <text x="114" y="178" font-family="'SF Mono', Menlo, monospace" font-size="10" fill="#64748b">telemetry:</text>
    <text x="180" y="178" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#046842">true</text>
    <text x="210" y="178" font-family="'SF Mono', Menlo, monospace" font-size="10" fill="#64748b">, autoHeal:</text>
    <text x="290" y="178" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#046842">true</text>

    <text x="100" y="198" font-family="'SF Mono', Menlo, monospace" font-size="10" fill="#0f172a">});</text>

    <text x="100" y="218" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#046842">await</text>
    <text x="138" y="218" font-family="'SF Mono', Menlo, monospace" font-size="10" fill="#0284c7">neuralAgent</text>
    <text x="212" y="218" font-family="'SF Mono', Menlo, monospace" font-size="10" fill="#64748b">.</text>
    <text x="220" y="218" font-family="'SF Mono', Menlo, monospace" font-size="10" fill="#d97706">deployCluster</text>
    <text x="310" y="218" font-family="'SF Mono', Menlo, monospace" font-size="10" fill="#0f172a">();</text>

    <!-- Mini Visual Microservice Pipeline Bar at Bottom of IDE -->
    <g transform="translate(76, 250)">
      <rect width="326" height="74" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Stage 1 -->
      <g transform="translate(14, 16)">
        <rect width="84" height="42" rx="8" fill="#f8fafc" stroke="#046842" stroke-opacity="0.3" stroke-width="1"/>
        <circle cx="16" cy="18" r="4" fill="#046842"/>
        <text x="26" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" font-weight="700" fill="#0f172a">AI Kernel</text>
        <text x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8" fill="#64748b">v4.2 • Core</text>
      </g>

      <!-- Arrow 1 -->
      <path d="M 106 37 L 122 37" stroke="#10b981" stroke-width="1.8" stroke-dasharray="2 2"/>
      <polygon points="122,34 127,37 122,40" fill="#10b981"/>

      <!-- Stage 2 -->
      <g transform="translate(132, 16)">
        <rect width="84" height="42" rx="8" fill="#f8fafc" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="16" cy="18" r="4" fill="#f59e0b"/>
        <text x="26" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" font-weight="700" fill="#0f172a">Cloud K8s</text>
        <text x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8" fill="#64748b">Distributed</text>
      </g>

      <!-- Arrow 2 -->
      <path d="M 224 37 L 240 37" stroke="#046842" stroke-width="1.8"/>
      <polygon points="240,34 245,37 240,40" fill="#046842"/>

      <!-- Stage 3 -->
      <g transform="translate(248, 16)">
        <rect width="64" height="42" rx="8" fill="#046842" fill-opacity="0.08" stroke="#046842" stroke-width="1"/>
        <text x="10" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" font-weight="700" fill="#046842">Sync 100%</text>
        <text x="10" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8" font-weight="600" fill="#046842">Live Edge</text>
      </g>
    </g>
  </g>

  <!-- ================= FLOATING GLASS WIDGET 1: NEURAL AI NODE MESH (TOP RIGHT) ================= -->
  <g transform="translate(390, 42)" filter="url(#cardShadow)">
    <rect width="210" height="154" rx="16" fill="url(#glassFillSubtle)" stroke="url(#glassBorder)" stroke-width="1.2"/>
    
    <!-- Header -->
    <g transform="translate(14, 14)">
      <rect width="28" height="28" rx="8" fill="#046842" fill-opacity="0.12"/>
      <path d="M 9 14 L 14 19 L 20 10" stroke="#046842" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="11" font-weight="700" fill="#0f172a">Neural Inference</text>
      <text x="36" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" fill="#059669">Ultra-low latency</text>
    </g>

    <!-- Radar / Node Matrix -->
    <g transform="translate(20, 56)">
      <!-- Outer Orbit -->
      <circle cx="85" cy="40" r="32" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 2"/>
      <circle cx="85" cy="40" r="18" stroke="#046842" stroke-opacity="0.25" stroke-width="1"/>
      
      <!-- Center Hub -->
      <circle cx="85" cy="40" r="8" fill="url(#emeraldGradient)"/>
      <circle cx="85" cy="40" r="4" fill="#ffffff"/>

      <!-- Orbiting Nodes -->
      <circle cx="58" cy="28" r="5" fill="#f59e0b"/>
      <line x1="85" y1="40" x2="58" y2="28" stroke="#f59e0b" stroke-width="1.2"/>

      <circle cx="112" cy="26" r="5" fill="#046842"/>
      <line x1="85" y1="40" x2="112" y2="26" stroke="#046842" stroke-width="1.2"/>

      <circle cx="98" cy="68" r="4.5" fill="#10b981"/>
      <line x1="85" y1="40" x2="98" y2="68" stroke="#10b981" stroke-width="1.2"/>

      <circle cx="62" cy="56" r="4" fill="#0284c7"/>
      <line x1="85" y1="40" x2="62" y2="56" stroke="#0284c7" stroke-width="1"/>
    </g>

    <!-- Live Metric Pill -->
    <g transform="translate(14, 118)">
      <rect width="182" height="24" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.8"/>
      <circle cx="12" cy="12" r="3" fill="#10b981"/>
      <text x="22" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" font-weight="600" fill="#334155">Inference Latency: </text>
      <text x="110" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" font-weight="700" fill="#046842">8.4ms</text>
      <text x="144" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" font-weight="600" fill="#f59e0b">● 99.99%</text>
    </g>
  </g>

  <!-- ================= FLOATING GLASS WIDGET 2: ENTERPRISE TELEMETRY (BOTTOM RIGHT) ================= -->
  <g transform="translate(420, 218)" filter="url(#cardShadow)">
    <rect width="190" height="142" rx="16" fill="url(#glassFillSubtle)" stroke="url(#glassBorder)" stroke-width="1.2"/>

    <g transform="translate(16, 16)">
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="11" font-weight="700" fill="#0f172a">Cloud Scalability</text>
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" fill="#64748b">Dynamic Auto-provisioning</text>

      <!-- Mini Chart Bars -->
      <g transform="translate(0, 36)">
        <!-- Bar 1 -->
        <rect x="0" y="32" width="16" height="28" rx="4" fill="#e2e8f0"/>
        <!-- Bar 2 -->
        <rect x="22" y="22" width="16" height="38" rx="4" fill="#cbd5e1"/>
        <!-- Bar 3 -->
        <rect x="44" y="14" width="16" height="46" rx="4" fill="#6ee7b7"/>
        <!-- Bar 4 -->
        <rect x="66" y="8" width="16" height="52" rx="4" fill="#10b981"/>
        <!-- Bar 5 -->
        <rect x="88" y="2" width="16" height="58" rx="4" fill="url(#emeraldGradient)"/>
        <!-- Trend Line -->
        <path d="M 8 44 Q 45 30, 96 10" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
        <circle cx="96" cy="10" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>

        <!-- Stat Pill -->
        <g transform="translate(112, 10)">
          <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="13" font-weight="800" fill="#046842">+280%</text>
          <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8" font-weight="600" fill="#64748b">Throughput</text>
        </g>
      </g>
    </g>

    <!-- Bottom Security Verified Tag -->
    <g transform="translate(16, 110)">
      <rect width="158" height="20" rx="5" fill="#046842" fill-opacity="0.08"/>
      <path d="M 8 10 L 11 13 L 16 7" stroke="#046842" stroke-width="1.5" stroke-linecap="round"/>
      <text x="22" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8.5" font-weight="700" fill="#046842">SOC2 Type II &amp; ISO 27001</text>
    </g>
  </g>
</svg>
