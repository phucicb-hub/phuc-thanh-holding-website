<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="100%" height="100%" fill="none" style="display:block;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="dhBgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#046842" stop-opacity="0.07"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="ecgGlow" cx="45%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#046842" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#046842" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vaultGlow" cx="75%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Gradients -->
    <linearGradient id="dhGlassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="dhCardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="dhBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="dhEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#046842"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="dhAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="dhShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.03"/>
    </filter>
    <filter id="dhCardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>

    <pattern id="dhDotGrid" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#94a3b8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="560" height="380" rx="22" fill="#fafbfe"/>
  <rect width="560" height="380" rx="22" fill="url(#dhBgGlow)"/>
  <rect x="18" y="18" width="524" height="344" rx="16" fill="url(#dhDotGrid)"/>

  <!-- Radial Glows -->
  <circle cx="250" cy="190" r="140" fill="url(#ecgGlow)"/>
  <circle cx="430" cy="110" r="100" fill="url(#vaultGlow)"/>

  <!-- Subtle Bio-Grid / Telemetry Guide Lines -->
  <g opacity="0.35" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4">
    <line x1="50" y1="180" x2="510" y2="180"/>
    <line x1="50" y1="230" x2="510" y2="230"/>
    <line x1="180" y1="60" x2="180" y2="330"/>
    <line x1="360" y1="60" x2="360" y2="330"/>
  </g>

  <!-- ================= MAIN CLINIC INTELLIGENCE INTERFACE ================= -->
  <g filter="url(#dhShadow)">
    <rect x="42" y="44" width="320" height="290" rx="18" fill="url(#dhGlassFill)" stroke="url(#dhBorder)" stroke-width="1.2"/>
    
    <!-- Top Header Bar -->
    <rect x="42" y="44" width="320" height="42" rx="18" fill="#f8fafc" fill-opacity="0.95"/>
    <rect x="42" y="70" width="320" height="16" fill="#f8fafc"/>
    <line x1="42" y1="86" x2="362" y2="86" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Pulse Icon + Clinic Title -->
    <g transform="translate(58, 55)">
      <rect width="20" height="20" rx="6" fill="#046842" fill-opacity="0.12"/>
      <path d="M 4 10 L 8 10 L 10 5 L 12 15 L 14 8 L 16 10 L 18 10" stroke="#046842" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="11" font-weight="700" fill="#0f172a">PT Clinic Core</text>
    </g>

    <!-- Real-time Live Badge -->
    <g transform="translate(268, 56)">
      <rect width="80" height="18" rx="9" fill="#10b981" fill-opacity="0.12"/>
      <circle cx="8" cy="9" r="3" fill="#10b981"/>
      <text x="16" y="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8.5" font-weight="700" fill="#046842">DATA LIVE</text>
    </g>

    <!-- Vital Stats Row -->
    <g transform="translate(58, 98)">
      <!-- Metric 1: Clinical Records -->
      <g>
        <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8.5" font-weight="600" fill="#64748b">INDEXED EMR</text>
        <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="17" font-weight="800" fill="#046842">1,240K+</text>
        <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8" font-weight="500" fill="#10b981">● 100% Validated</text>
      </g>

      <!-- Vertical Divider -->
      <line x1="90" y1="2" x2="90" y2="42" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Metric 2: Diagnostic Accuracy -->
      <g transform="translate(104, 0)">
        <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8.5" font-weight="600" fill="#64748b">DIAGNOSTIC AI</text>
        <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="17" font-weight="800" fill="#0f172a">99.8%</text>
        <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8" font-weight="500" fill="#d97706">● Sub-second Triage</text>
      </g>
    </g>

    <!-- Telemetry ECG Display Monitor -->
    <g transform="translate(58, 154)">
      <rect width="288" height="96" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Grid lines inside monitor -->
      <g stroke="#cbd5e1" stroke-width="0.7" opacity="0.3" stroke-dasharray="2 3">
        <line x1="0" y1="24" x2="288" y2="24"/>
        <line x1="0" y1="48" x2="288" y2="48"/>
        <line x1="0" y1="72" x2="288" y2="72"/>
        <line x1="72" y1="0" x2="72" y2="96"/>
        <line x1="144" y1="0" x2="144" y2="96"/>
        <line x1="216" y1="0" x2="216" y2="96"/>
      </g>

      <!-- ECG Waveform (Emerald / Neon) -->
      <path d="M 10 52 L 40 52 L 48 52 L 54 36 L 60 68 L 68 18 L 76 80 L 82 46 L 88 52 L 120 52 L 128 52 L 134 38 L 140 64 L 148 20 L 156 78 L 162 48 L 168 52 L 200 52 L 208 52 L 214 40 L 220 62 L 228 22 L 236 76 L 242 50 L 248 52 L 278 52" 
            fill="none" stroke="url(#dhEmerald)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Pulse Dot with Glow -->
      <circle cx="236" cy="76" r="4" fill="#10b981"/>
      <circle cx="236" cy="76" r="8" fill="#10b981" fill-opacity="0.3"/>

      <!-- Monitor Label -->
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" font-weight="700" fill="#046842">PATIENT FLOW TELEMETRY</text>
      <text x="210" y="20" font-family="'SF Mono', monospace" font-size="9" font-weight="700" fill="#d97706">72 BPM</text>
    </g>

    <!-- Bottom Feature Tags -->
    <g transform="translate(58, 264)">
      <rect width="138" height="24" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.8"/>
      <circle cx="10" cy="12" r="3" fill="#046842"/>
      <text x="20" y="15.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" font-weight="600" fill="#334155">HL7 / FHIR Standard</text>

      <rect x="146" y="0" width="142" height="24" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.8"/>
      <circle cx="156" cy="12" r="3" fill="#d97706"/>
      <text x="166" y="15.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" font-weight="600" fill="#334155">Smart Clinic Dispense</text>
    </g>
  </g>

  <!-- ================= FLOATING WIDGET 1: DATALAKE VAULT SHIELD (TOP RIGHT) ================= -->
  <g transform="translate(330, 48)" filter="url(#dhCardShadow)">
    <rect width="186" height="152" rx="16" fill="url(#dhCardGlass)" stroke="url(#dhBorder)" stroke-width="1.2"/>

    <g transform="translate(16, 16)">
      <!-- Security Shield Badge -->
      <rect width="32" height="32" rx="10" fill="#046842" fill-opacity="0.1"/>
      <path d="M 16 6 L 24 10 L 24 16 C 24 21 20 25 16 27 C 12 25 8 21 8 16 L 8 10 Z" fill="#046842" fill-opacity="0.2" stroke="#046842" stroke-width="1.5"/>
      <path d="M 13 16 L 15 18 L 19 14" stroke="#046842" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="40" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="11" font-weight="700" fill="#0f172a">PT DataLake Vault</text>
      <text x="40" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8.5" fill="#059669">AES-256 GCM Encrypted</text>
    </g>

    <!-- DataLake Partition Rings / Storage Node -->
    <g transform="translate(20, 58)">
      <!-- Outer Data Orbit -->
      <circle cx="73" cy="34" r="28" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 3"/>
      
      <!-- Central Encrypted Core -->
      <rect x="55" y="16" width="36" height="36" rx="8" fill="#ffffff" stroke="#046842" stroke-width="1.2"/>
      <path d="M 68 28 L 73 24 L 78 28 L 78 36 L 68 36 Z" fill="none" stroke="#d97706" stroke-width="1.4"/>
      <circle cx="73" cy="33" r="1.5" fill="#d97706"/>

      <!-- Node 1 -->
      <circle cx="48" cy="22" r="4.5" fill="#10b981"/>
      <line x1="55" y1="26" x2="48" y2="22" stroke="#10b981" stroke-width="1"/>
      
      <!-- Node 2 -->
      <circle cx="98" cy="22" r="4.5" fill="#0284c7"/>
      <line x1="91" y1="26" x2="98" y2="22" stroke="#0284c7" stroke-width="1"/>

      <!-- Node 3 -->
      <circle cx="73" cy="62" r="4.5" fill="#f59e0b"/>
      <line x1="73" y1="52" x2="73" y2="62" stroke="#f59e0b" stroke-width="1"/>
    </g>

    <!-- Bottom Compliance Seal -->
    <g transform="translate(16, 116)">
      <rect width="154" height="22" rx="6" fill="#046842" fill-opacity="0.08"/>
      <text x="14" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8.5" font-weight="700" fill="#046842">HIPAA / GDPR / MOH COMPLIANT</text>
    </g>
  </g>

  <!-- ================= FLOATING WIDGET 2: COHORT ANALYTICS (BOTTOM RIGHT) ================= -->
  <g transform="translate(346, 214)" filter="url(#dhCardShadow)">
    <rect width="176" height="136" rx="16" fill="url(#dhCardGlass)" stroke="url(#dhBorder)" stroke-width="1.2"/>

    <g transform="translate(16, 14)">
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="10.5" font-weight="700" fill="#0f172a">Population Health</text>
      <text x="0" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8.5" fill="#64748b">Predictive Risk Triage</text>

      <!-- Mini Donut Ring & Percentage -->
      <g transform="translate(0, 32)">
        <circle cx="30" cy="30" r="24" stroke="#e2e8f0" stroke-width="5" fill="none"/>
        <circle cx="30" cy="30" r="24" stroke="#046842" stroke-width="5" fill="none" stroke-dasharray="110 150" stroke-linecap="round" transform="rotate(-90 30 30)"/>
        <text x="30" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="10.5" font-weight="800" fill="#046842" text-anchor="middle">94%</text>

        <!-- Legend -->
        <g transform="translate(70, 10)">
          <circle cx="4" cy="5" r="3" fill="#046842"/>
          <text x="12" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8.5" font-weight="600" fill="#334155">Preventive Care</text>

          <circle cx="4" cy="22" r="3" fill="#d97706"/>
          <text x="12" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8.5" font-weight="600" fill="#334155">Chronic Care</text>

          <circle cx="4" cy="39" r="3" fill="#cbd5e1"/>
          <text x="12" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8.5" fill="#64748b">Stable Cohort</text>
        </g>
      </g>
    </g>

    <!-- Tag -->
    <g transform="translate(16, 102)">
      <rect width="144" height="20" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="10" y="13.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="8" font-weight="600" fill="#64748b">AI Cohort Clustering Active</text>
    </g>
  </g>
</svg>
